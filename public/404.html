<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="Page not found — The Social Mahjong Club">Halaman tidak ditemukan — The Social Mahjong Club</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#087048">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Schibsted+Grotesk:wght@400;700;800&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
  :root{--cream:#EAF3DF;--paper:#FAFCF5;--green:#087048;--green-dk:#04552F;--ink:#04331F;--red:#C02028;--mut:#4E5C4B}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:'Schibsted Grotesk',sans-serif;line-height:1.55;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
  .box{max-width:460px}
  .tile{font-family:'Noto Serif TC',serif;font-weight:900;color:var(--green);background:#fff;
    width:78px;height:100px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:44px;border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink);margin:0 auto 22px}
  .kick{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--red)}
  h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(32px,7vw,46px);margin:10px 0 12px}
  p{color:var(--mut);font-size:16px;margin-bottom:26px}
  .btn{display:inline-block;text-decoration:none;font-weight:800;font-size:16px;padding:14px 28px;border-radius:12px;
    background:var(--green);color:var(--cream);box-shadow:0 3px 0 var(--green-dk)}
  .btn:active{transform:translateY(1px);box-shadow:none}
  .alt{display:block;margin-top:16px;font-size:14px;color:var(--green);font-weight:800;text-decoration:none}
  .lang-switch{display:inline-flex;gap:2px;background:var(--cream);border:1.5px solid rgba(4,51,31,.2);
    border-radius:99px;padding:2px}
  .lang-switch button{border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:11.5px;
    font-weight:800;letter-spacing:.06em;color:var(--mut);padding:5px 11px;border-radius:99px;line-height:1}
  .lang-switch button.on{background:var(--green);color:#fff}
</style>
</head>
<body>
  <div style="position:absolute;top:16px;right:18px" data-lang-switch></div>
  <div class="box">
    <div class="tile">東</div>
    <div class="kick" data-en="404 · WRONG TABLE">404 · SALAH MEJA</div>
    <h1 data-en="This page does not exist">Halaman ini tidak ada</h1>
    <p data-en="Looks like a tile went missing. The page you were after has moved, or never existed. Let us head back to the main table.">Sepertinya tile-nya kececer. Halaman yang kamu cari sudah dipindah atau tidak pernah ada. Yuk balik ke meja utama.</p>
    <a class="btn" href="/" data-en="← Back to Home">← Kembali ke Beranda</a>
    <a class="alt" href="/#jadwal" data-en="See the schedule &amp; book a slot →">Lihat jadwal &amp; book slot →</a>
  </div>
<script src="/i18n.js"></script>
</body>
</html>
